<!doctype html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Our Journey — Skyfare Consulting</title>
  <meta name="description"
    content="Follow Skyfare Consulting on TikTok and Instagram — real cabin reviews, lounge walkthroughs, and behind-the-scenes from every flight we arrange." />
  <link rel="icon" href="../logos/logo.webp" />

  <script src="../js/links.js"></script>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="../lib/font-awesome/css/all.min.css">

  <!-- Tailwind -->
  <script src="../lib/tailwind/tailwind.min.js"></script>

  <!-- Injectable Header & Footer -->
  <script src="../js/header.js" defer></script>
  <script src="../js/footer.js" defer></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;600;700&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/tailwind-config.js" defer></script>
</head>

<body class="min-h-screen flex flex-col bg-white">

  <div id="page-loader">
    <img src="../logos/logo.webp" alt="Skyfare Consulting">
    <div id="loader-dots"><span></span><span></span><span></span></div>
  </div>

  <main class="flex-1">

    <!-- HERO -->
    <section class="container mx-auto px-4 pt-16 md:pt-24 pb-12 text-center">
      <div class="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-brand-500/10 text-brand-600 text-xs font-bold uppercase tracking-widest mb-6 border border-brand-500/20">
        <i class="fa-solid fa-film"></i> Behind the Scenes
      </div>
      <h1 class="text-4xl md:text-6xl font-extrabold text-brand-950 mb-6 tracking-tight">
        Follow Our <span class="text-transparent bg-clip-text brand-gradient">Journey.</span>
      </h1>
      <p class="text-lg md:text-xl text-neutral-600 max-w-2xl mx-auto leading-relaxed">
        Real cabin reviews, lounge walkthroughs, and award redemption breakdowns — straight from the flights we arrange.
      </p>
      <div class="mt-8 flex flex-wrap justify-center gap-4">
        <a id="tiktok-follow-hero" href="https://www.tiktok.com/@skyfarevlogs" target="_blank" rel="noopener noreferrer"
           class="inline-flex items-center gap-2 px-6 py-3 rounded-2xl bg-neutral-950 text-white font-semibold hover:bg-neutral-800 transition-all active:scale-95">
          <i class="fa-brands fa-tiktok"></i> Follow on TikTok
        </a>
        <a id="instagram-follow-hero" href="https://www.instagram.com/skyfareconsulting/" target="_blank" rel="noopener noreferrer"
           class="inline-flex items-center gap-2 px-6 py-3 rounded-2xl bg-gradient-to-tr from-purple-500 via-pink-500 to-orange-400 text-white font-semibold hover:opacity-90 transition-all active:scale-95">
          <i class="fa-brands fa-instagram"></i> Follow on Instagram
        </a>
      </div>
    </section>

    <!-- TIKTOK + INSTAGRAM -->
    <section class="py-16 bg-white">
      <div class="container mx-auto px-4 md:px-6">

        <div class="grid lg:grid-cols-2 gap-6 items-start">

          <!-- TikTok column -->
          <div class="social-col">
            <div class="flex items-center justify-between mb-5">
              <div class="flex items-center gap-2">
                <i class="fa-brands fa-tiktok text-sm text-neutral-400"></i>
                <span id="tiktok-handle" class="text-xs font-bold text-neutral-500 uppercase tracking-widest">@skyfarevlogs</span>
              </div>
              <a id="tiktok-follow-link" href="https://www.tiktok.com/@skyfarevlogs" target="_blank" rel="noopener noreferrer"
                 class="btn-pill btn-pill-primary" style="padding:0.4rem 1rem;font-size:0.75rem;">
                Follow <i class="fa-solid fa-arrow-up-right-from-square text-[9px]"></i>
              </a>
            </div>
            <div class="grid grid-cols-2 gap-3 social-col-embed">
              <div id="tiktok-card-1" class="tiktok-card relative overflow-hidden cursor-pointer bg-black rounded-xl" data-video-id="">
                <div style="height:739px;">
                  <iframe id="tiktok-iframe-1" src="" style="width:100%;height:100%;border:none;display:block;" allow="encrypted-media; fullscreen" loading="lazy" title=""></iframe>
                </div>
              </div>
              <div id="tiktok-card-2" class="tiktok-card relative overflow-hidden cursor-pointer bg-black rounded-xl" data-video-id="">
                <div style="height:739px;">
                  <iframe id="tiktok-iframe-2" src="" style="width:100%;height:100%;border:none;display:block;" allow="encrypted-media; fullscreen" loading="lazy" title=""></iframe>
                </div>
              </div>
            </div>
          </div>

          <!-- Instagram column -->
          <div class="social-col">
            <div class="flex items-center justify-between mb-5">
              <div class="flex items-center gap-2">
                <i class="fa-brands fa-instagram text-sm text-pink-500"></i>
                <span id="instagram-handle" class="text-xs font-bold text-neutral-500 uppercase tracking-widest">@skyfareconsulting</span>
              </div>
              <a id="instagram-follow-link" href="https://www.instagram.com/skyfareconsulting/" target="_blank" rel="noopener noreferrer"
                 class="btn-pill btn-pill-primary" style="padding:0.4rem 1rem;font-size:0.75rem;">
                Follow <i class="fa-solid fa-arrow-up-right-from-square text-[9px]"></i>
              </a>
            </div>
            <div class="grid grid-cols-2 gap-3 social-col-embed">
              <div id="instagram-embed-1" class="relative rounded-xl overflow-hidden" style="height:739px;"></div>
              <div id="instagram-embed-2" class="relative rounded-xl overflow-hidden" style="height:739px;"></div>
            </div>
          </div>

        </div>

      </div>
    </section>

    <!-- ELFSIGHT SOCIAL FEEDS -->
    <section class="py-20 bg-white border-t border-neutral-100">
      <div class="container mx-auto px-4 md:px-6">

        <div class="text-center mb-12 slide-up">
          <p class="text-[10px] font-bold uppercase tracking-[0.3em] text-brand-500 mb-3">More From Us</p>
          <h2 class="text-3xl md:text-4xl font-display font-bold text-neutral-900 tracking-tight">
            Follow Our Journey
          </h2>
        </div>

        <script src="https://elfsightcdn.com/platform.js" async></script>

        <div class="mb-10 slide-up">
          <div class="elfsight-app-af588d95-2918-4862-b064-e21507dbbfa9" data-elfsight-app-lazy></div>
        </div>

        <div class="slide-up" style="animation-delay:0.1s;">
          <div class="elfsight-app-759d2710-2e46-42e2-882e-8caa1d8309cb" data-elfsight-app-lazy></div>
        </div>

      </div>
    </section>

  </main>

  <!-- TikTok Modal -->
  <div id="tiktok-modal" class="fixed inset-0 z-[100] hidden items-center justify-center p-4" role="dialog" aria-modal="true">
    <div id="tiktok-modal-backdrop" class="absolute inset-0 bg-black/80 backdrop-blur-md cursor-pointer"></div>
    <div class="relative z-10 flex flex-col items-center">
      <button id="tiktok-modal-close"
        class="mb-4 w-10 h-10 rounded-full bg-white/10 border border-white/20 flex items-center justify-center text-white text-lg hover:bg-white/20 transition-all self-end"
        aria-label="Close">
        <i class="fa-solid fa-xmark"></i>
      </button>
      <div id="tiktok-modal-frame"
        class="rounded-2xl overflow-hidden bg-black w-[min(360px,90vw)]"
        style="height:min(739px,80vh);">
      </div>
    </div>
  </div>

  <script>
  (function () {
    var modal         = document.getElementById('tiktok-modal');
    var modalFrame    = document.getElementById('tiktok-modal-frame');
    var modalClose    = document.getElementById('tiktok-modal-close');
    var modalBackdrop = document.getElementById('tiktok-modal-backdrop');

    function openModal(embedUrl) {
      var iframe = document.createElement('iframe');
      iframe.src = embedUrl;
      iframe.setAttribute('allowfullscreen', '');
      iframe.setAttribute('allow', 'encrypted-media; autoplay; fullscreen');
      iframe.style.cssText = 'width:100%;height:100%;border:none;display:block;';
      modalFrame.appendChild(iframe);
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      modalFrame.innerHTML = '';
      modal.classList.add('hidden');
      modal.classList.remove('flex');
      document.body.style.overflow = '';
    }

    document.querySelectorAll('.tiktok-card').forEach(function (card) {
      card.addEventListener('click', function () {
        openModal('https://www.tiktok.com/embed/v2/' + this.dataset.videoId + '?autoplay=1');
      });
    });

    if (modalClose)    modalClose.addEventListener('click', closeModal);
    if (modalBackdrop) modalBackdrop.addEventListener('click', closeModal);
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') closeModal();
    });
  })();
  </script>

</body>
</html>
