<body class="private-body altitude-portal-shell" data-private-page="altitude" data-private-product="Altitude" data-private-subtitle="Latest issues" data-altitude-section="newsletter">

    <img src="../../../logos/logo.webp" alt="Skyfare Consulting">
    <div id="loader-dots"><span></span><span></span><span></span></div>

  <main id="main-content" class="private-main altitude-portal-main">
    <section class="altitude-member-page" aria-labelledby="alt-archive-title">
      <div class="private-container">
        <div class="altitude-page-heading altitude-page-heading--split slide-up is-visible">
          <div>
            <a href="../altitude-access-portal" class="altitude-back-link"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Overview</a>
            <h1 id="alt-archive-title">Browse the archive.</h1>
            <p>Find a specific issue by access level or topic. Premium articles open directly with your active member access.</p>
          </div>
          <div class="alt-archive-toolbar-col">
            <div class="private-toolbar justify-between" aria-label="Archive filters">
              <div id="alt-filters" class="private-toolbar" aria-label="Filter by access">
                <button type="button" data-filter="all" class="alt-filter-btn active">All</button>
                <button type="button" data-filter="free" class="alt-filter-btn">Free</button>
                <button type="button" data-filter="premium" class="alt-filter-btn alt-filter-btn--gold"><i class="fa-solid fa-crown" aria-hidden="true"></i> Premium</button>
              </div>
              <!-- Topic dropdown, AND-combined with the access filter above
                   (js/altitude-portal.js's _getFilteredPosts). Values are display
                   labels, matched case-insensitively -- Beehiiv always lowercases
                   content_tags regardless of a tag's configured display casing. -->
              <select id="alt-topic-select" class="alt-filter-select" aria-label="Filter by topic">
                <option value="all">All Topics</option>
                <option value="Credit/Debit Cards">Credit/Debit Cards</option>
                <option value="Airlines">Airlines</option>
                <option value="News">News</option>
                <option value="Redemption Availability">Redemption Availability</option>
              </select>
            </div>
            <!-- Search box: matches title, summary, and topic tags
                 (case-insensitive substring), AND-combined with the access/topic
                 filters above in js/altitude-portal.js's _getFilteredPosts(). -->
            <div class="alt-archive-search-wrap">
              <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
              <input type="search" id="alt-archive-search" class="alt-archive-search" placeholder="Search issues by title, topic, or summary" aria-label="Search issues" autocomplete="off">
              <button type="button" id="alt-archive-search-clear" class="alt-archive-search-clear" aria-label="Clear search" hidden><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
            </div>
          </div>
        </div>

        <div class="altitude-archive-count private-panel slide-up is-visible">
          <div class="icon-chip icon-chip-lg"><i class="fa-solid fa-newspaper" aria-hidden="true"></i></div>
          <div>
            <p class="private-summary__label">Available issues</p>
            <p id="alt-post-count" class="private-summary__title"><span class="private-skel-line private-skel-line--inline" style="width:5rem;height:1em;" aria-label="Loading issues"></span></p>
          </div>
        </div>

        <div id="alt-archive-grid" class="private-grid" role="status" aria-live="polite" aria-label="Loading your issue archive">
          <div class="private-skel-card">
            <div class="private-skel-card__media"></div>
            <div class="private-skel-card__body">
              <span class="private-skel-line" style="width:35%;"></span>
              <span class="private-skel-title" style="width:85%;"></span>
              <span class="private-skel-line" style="width:45%;"></span>
            </div>
          </div>

          <div class="private-skel-card">
