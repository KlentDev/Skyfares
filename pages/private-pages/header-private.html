<header class="private-header">
  <div class="private-header__inner">
    <a class="private-brand" href="../../index.html" aria-label="Skyfare home">
      <img src="../../logos/logo.webp" alt="Skyfare Consulting">
      <span>
        <strong>Skyfare</strong>
        <small>Private access</small>
      </span>
    </a>

    <nav class="private-nav" aria-label="Member navigation">
      <a href="altitude-access-portal.html" data-private-nav="altitude">
        <i class="fa-solid fa-crown" aria-hidden="true"></i>
        <span>Altitude</span>
      </a>
      <a href="kf-guide-access-portal.html" data-private-nav="guide">
        <i class="fa-solid fa-book-open" aria-hidden="true"></i>
        <span>Guide</span>
      </a>
    </nav>

    <div class="private-account" aria-label="Account">
      <div class="private-account__meta">
        <span id="private-member-product">Member Portal</span>
        <small id="private-member-email">Signed in</small>
      </div>
      <button type="button" data-private-manage class="private-icon-btn" aria-label="Manage membership">
        <i class="fa-solid fa-credit-card" aria-hidden="true"></i>
      </button>
      <div class="private-account-menu" data-private-account-menu>
        <button type="button" class="private-icon-btn private-account-trigger" data-private-account-trigger aria-label="Account menu" aria-haspopup="menu" aria-expanded="false">
          <i class="fa-solid fa-user-gear" aria-hidden="true"></i>
        </button>
        <div class="private-account-dropdown" data-private-account-dropdown role="menu" aria-label="Account menu">
          <a href="altitude-access/membership.html" data-private-menu-membership data-private-menu-altitude-only role="menuitem">
            <i class="fa-solid fa-credit-card" aria-hidden="true"></i>
            <span>Membership</span>
          </a>
          <a href="altitude-access/beehiiv-manual.html" data-private-menu-manual data-private-menu-altitude-only role="menuitem">
            <i class="fa-solid fa-book-open-reader" aria-hidden="true"></i>
            <span>Beehiiv Manual</span>
          </a>
          <a href="altitude-access/support.html" data-private-menu-support data-private-menu-altitude-only role="menuitem">
            <i class="fa-solid fa-headset" aria-hidden="true"></i>
            <span>Support</span>
          </a>
          <button type="button" data-private-signout role="menuitem">
            <i class="fa-solid fa-arrow-right-from-bracket" aria-hidden="true"></i>
            <span>Sign out</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</header>

<div class="private-signout-modal" data-private-signout-modal hidden>
  <div class="private-signout-modal__backdrop" data-private-signout-cancel></div>
  <section class="private-signout-modal__dialog" role="dialog" aria-modal="true" aria-labelledby="private-signout-title">
    <div class="private-signout-modal__icon">
      <i class="fa-solid fa-arrow-right-from-bracket" aria-hidden="true"></i>
    </div>
    <h2 id="private-signout-title">Sign out?</h2>
    <p>Are you sure you want to sign out of your private access session?</p>
    <div class="private-signout-modal__actions">
      <button type="button" class="private-action" data-private-signout-cancel>No</button>
      <button type="button" class="private-action private-action--primary" data-private-signout-confirm>Yes, sign out</button>
    </div>
  </section>
</div>
