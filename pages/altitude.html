<!doctype html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Altitude Access — Skyfare</title>
  <meta name="description" content="Premium travel intelligence for Business and First Class travelers. Award alerts, cabin reviews, routing strategies, and exclusive content — $4.99/month." />
  <link rel="icon" href="../logos/logo.webp" />

  <script src="../js/links.js"></script>
  <link rel="stylesheet" href="../lib/font-awesome/css/all.min.css">
  <script src="../lib/tailwind/tailwind.min.js"></script>
  <script src="../js/header.js" defer></script>
  <script src="../js/footer.js" defer></script>
  <script src="../js/cookie-consent.js" defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;600;700&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/tailwind-config.js" defer></script>
</head>

<body class="min-h-screen flex flex-col bg-white">

  <div id="page-loader">
    <img src="../logos/logo.webp" alt="Skyfare Consulting">
    <div id="loader-dots"><span></span><span></span><span></span></div>
  </div>

  <main class="flex-1">
    <!-- altitude.js renders everything into #alt-main -->
    <div id="alt-main">
      <!-- Loading placeholder while JS boots -->
      <div class="newsletter-hero-bg py-24 text-center">
        <div class="w-10 h-10 rounded-full bg-white/10 animate-pulse mx-auto mb-6"></div>
        <div class="h-6 bg-white/10 rounded-full w-64 mx-auto animate-pulse mb-3"></div>
        <div class="h-4 bg-white/10 rounded-full w-40 mx-auto animate-pulse"></div>
      </div>
    </div>
  </main>

  <script src="../js/altitude.js" defer></script>

</body>
</html>
