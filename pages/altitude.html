  <script>
  (function () {
    window.addEventListener('load', function () {
      var header = document.getElementById('main-header');
      if (!header) return;

      var pubHero = document.getElementById('alt-public-hero');

      function syncPadding() {
        var banner  = document.getElementById('skyfare-newsletter-banner');
        var bannerH = (banner && banner.offsetHeight) ? banner.offsetHeight : 0;
        var offset  = header.offsetHeight + 32 + bannerH;
        document.body.style.paddingTop = '0';
        if (pubHero) pubHero.style.paddingTop = offset + 'px';
      }

      syncPadding();
      setTimeout(syncPadding, 700);
      new MutationObserver(syncPadding).observe(document.body, { childList: true });
    });
  })();
  </script>
