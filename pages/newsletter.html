<!doctype html>
<html lang="en" class="scroll-smooth">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-DX0B0NKJDC"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('consent', 'default', {
      'analytics_storage': 'denied',
      'ad_storage': 'denied',
      'ad_user_data': 'denied',
      'ad_personalization': 'denied'
    });
    gtag('js', new Date());
    gtag('config', 'G-DX0B0NKJDC');
  </script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Skyfare Altitude — Newsletter</title>
  <meta name="description"
    content="Weekly award space alerts, cabin reviews, and routing strategies for travelers who fly Business and First Class on points. Free to subscribe." />
  <link rel="icon" href="../logos/logo.webp" />
  <link rel="manifest" href="../manifest.json" />
  <meta name="theme-color" content="#0066cc" />
  <link rel="apple-touch-icon" href="../images/icons/apple-touch-icon.png" />
  <script src="../js/sw-register.js" defer></script>

  <script src="../js/links.js"></script>
  <link rel="stylesheet" href="../lib/font-awesome/css/all.min.css">
  <link rel="stylesheet" href="../css/tailwind.css">
  <script src="../js/header.js" defer></script>
  <script src="../js/footer.js" defer></script>
  <script src="../js/cookie-consent.js" defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;600;700&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>

<body class="min-h-screen flex flex-col bg-white">

  <div id="page-loader">
    <img src="../logos/logo.webp" alt="Skyfare Consulting">
    <div id="loader-dots"><span></span><span></span><span></span></div>
  </div>

  <main class="flex-1">

    <!-- =============================================
         1. HERO — full-bleed carousel of the 3 latest issues, populated by
         renderHeroCarousel() in js/newsletter-archive.js. Deliberately not
         .page-hero-bg (the static-photo hero every other interior page
         shares) -- this page's hero content IS the latest issues, not a
         stock brand photo.
         ============================================= -->
    <section class="newsletter-hero-v3" id="newsletter-hero-carousel" aria-label="Latest issues">

      <div id="newsletter-hero-track" class="newsletter-hero-v3__track" aria-live="off">
        <!-- Skeleton slide -- swapped out once js/newsletter-archive.js's fetch resolves.
             No placeholder copy on purpose (a fake title/badge reads as broken content,
             not a loading state) -- pulsing bars only, same idea as the archive grid's
             own skeleton cards further down this page. -->
        <div class="newsletter-hero-v3__slide is-active" style="--hero-img:url('../images/page-images/newsletter.png');">
          <div class="newsletter-hero-v3__slide-content container mx-auto px-4 md:px-6">
            <div class="newsletter-hero-v3__tags-row">
              <span class="newsletter-hero-v3__skel newsletter-hero-v3__skel--chip animate-pulse"></span>
              <span class="newsletter-hero-v3__skel newsletter-hero-v3__skel--chip animate-pulse"></span>
            </div>
            <div class="newsletter-hero-v3__skel newsletter-hero-v3__skel--title animate-pulse"></div>
            <div class="newsletter-hero-v3__skel newsletter-hero-v3__skel--desc animate-pulse"></div>
            <div class="newsletter-hero-v3__skel newsletter-hero-v3__skel--meta animate-pulse"></div>
          </div>
        </div>
      </div>

      <div id="newsletter-hero-dots" class="newsletter-hero-v3__dots" role="tablist" aria-label="Choose issue"></div>
    </section>


    <!-- =============================================
         2. ARCHIVE — all issues grid
         Add new cards here as issues publish.
         ============================================= -->
    <section class="py-24 tile-parch" id="archive">
      <div class="container mx-auto px-4 md:px-6">

        <div class="flex items-center gap-4 mb-4 slide-up">
          <p class="text-[10px] font-bold uppercase tracking-[0.3em] text-neutral-500 flex-shrink-0">All Issues</p>
          <div class="flex-1 h-px bg-neutral-200"></div>
          <span id="archive-count" class="text-[10px] text-neutral-400 font-medium flex-shrink-0 animate-pulse">Loading</span>
        </div>
        <h2 class="text-3xl md:text-4xl font-display font-bold text-neutral-900 mb-6 tracking-tight slide-up">
          Every issue, all in one place.
        </h2>

        <!-- One toolbar: an access segment (All/Free/Premium, post.is_premium)
             plus a topic dropdown (post.content_tags, matched case-insensitively
             since Beehiiv lowercases content_tags regardless of a tag's
             configured display casing -- confirmed live). Both AND-combine in
             js/newsletter-archive.js's _getFilteredArchivePosts(). -->
        <div class="flex flex-wrap items-center justify-between gap-3 mb-8 max-w-5xl mx-auto slide-up">
          <div id="archive-access-filters" class="filter-segment" role="group" aria-label="Filter by access">
            <button type="button" data-access="all" class="filter-pill active">All</button>
            <button type="button" data-access="free" class="filter-pill">Free</button>
            <button type="button" data-access="premium" class="filter-pill filter-pill--gold"><i class="fa-solid fa-crown"></i> Premium</button>
          </div>
          <select id="archive-topic-select" class="filter-select" aria-label="Filter by topic">
            <option value="all">All Topics</option>
            <option value="Credit/Debit Cards">Credit/Debit Cards</option>
            <option value="Airlines">Airlines</option>
            <option value="News">News</option>
            <option value="Redemption Availability">Redemption Availability</option>
          </select>
        </div>

        <div id="archive-grid" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-5 max-w-5xl mx-auto">

          <div class="card-utility overflow-hidden animate-pulse slide-up">
            <div class="h-44 bg-neutral-100"></div>
            <div class="p-5 space-y-2">
              <div class="h-2.5 w-24 bg-neutral-100 rounded-full"></div>
              <div class="h-3.5 w-4/5 bg-neutral-100 rounded-full"></div>
              <div class="h-2.5 w-16 bg-neutral-100 rounded-full mt-3"></div>
            </div>
          </div>
          <div class="card-utility overflow-hidden animate-pulse slide-up" style="animation-delay:.05s;">
            <div class="h-44 bg-neutral-100"></div>
            <div class="p-5 space-y-2">
              <div class="h-2.5 w-24 bg-neutral-100 rounded-full"></div>
              <div class="h-3.5 w-4/5 bg-neutral-100 rounded-full"></div>
              <div class="h-2.5 w-16 bg-neutral-100 rounded-full mt-3"></div>
            </div>
          </div>
          <div class="card-utility overflow-hidden animate-pulse slide-up" style="animation-delay:.1s;">
            <div class="h-44 bg-neutral-100"></div>
            <div class="p-5 space-y-2">
              <div class="h-2.5 w-24 bg-neutral-100 rounded-full"></div>
              <div class="h-3.5 w-4/5 bg-neutral-100 rounded-full"></div>
              <div class="h-2.5 w-16 bg-neutral-100 rounded-full mt-3"></div>
            </div>
          </div>

        </div>
      </div>
    </section>


    <!-- =============================================
         3. INSIDE THE BRIEF — moved out of the hero (2026-08-25), now sits
         directly under the archive grid; same desk-card component/CSS as
         before, just relocated.
         ============================================= -->
    <section class="tile-mist py-16" aria-label="What the newsletter covers">
      <div class="container mx-auto px-4 md:px-6">
        <div class="newsletter-hero-v2__desk newsletter-hero-v2__desk--light slide-up">
          <div class="newsletter-hero-v2__desk-head">
            <span>Inside the brief</span>
            <strong>What you'll find in every issue</strong>
          </div>
          <div class="newsletter-hero-v2__desk-grid">
            <span><i class="fa-solid fa-credit-card" aria-hidden="true"></i>Credit/Debit Cards</span>
            <span><i class="fa-solid fa-newspaper" aria-hidden="true"></i>News</span>
            <span><i class="fa-solid fa-ticket" aria-hidden="true"></i>Redemption Availability</span>
            <span><i class="fa-solid fa-plane" aria-hidden="true"></i>Airlines</span>
          </div>
          <p>One useful issue each week: card and transfer moves, breaking news, live redemption windows, and airline-specific strategy.</p>
        </div>
      </div>
    </section>


    <!-- =============================================
         4. FOOTER CTA BAND — reusable component, newsletter-form mode
         ============================================= -->
    <div data-cta-mount data-cta-mode="newsletter-form" style="min-height:300px"
      data-cta-eyebrow-icon="fa-solid fa-envelope-open-text"
      data-cta-eyebrow-text="Subscribe Free"
      data-cta-heading="Get it in your inbox."
      data-cta-description="Weekly. Free. No spam."
      data-cta-art-image="../images/page-images/bg-3.JPG"
    ></div>
    <script src="../js/cta-section.js" defer></script>

  </main>

  <script src="../js/newsletter-archive.js" defer></script>
  <script src="../js/newsletter.js" defer></script>

</body>
</html>
