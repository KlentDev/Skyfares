name = "skyfares-reports-bot"
main = "worker.js"
compatibility_date = "2026-07-09"

[triggers]
# Cloudflare cron triggers always fire in UTC — there is no timezone field. Manila is UTC+8,
# so "00:05 Manila" and "08:05 Manila" convert to UTC hours 16 (previous UTC day) and 0:
#   00:05 Manila = 16:05 UTC   08:05 Manila = 00:05 UTC
# A SINGLE trigger, "5 0,16 * * *" — fires at :05 past UTC hour 0 AND UTC hour 16, which lands
# on :05 past Manila hour 8 and Manila hour 0 respectively (one registered cron expression,
# since Cloudflare accounts cap out at 5 total across every Worker and there wasn't room for
# one trigger per report type). worker.js's scheduled() handler tells the two firings apart by
# checking the actual MANILA hour at fire time (via getManilaHourAndDay), not the UTC hour:
#   Manila hour 0  (fires at 16:05 UTC) — daily report for the day that just ended (e.g.
#                  Monday's report sends Tuesday 00:05 Manila); also the weekly report if that
#                  day was a Sunday.
#   Manila hour 8  (fires at 00:05 UTC) — monthly report, only acts on the 1st of the month.
crons = ["5 0,16 * * *"]

[[kv_namespaces]]
binding = "REPORTS_KV"
id = "0a916c2855a647a1889720823fe8e2a1"

[vars]
AIRTABLE_BASE_ID = "appA5rSlwgc57nswR"
AIRTABLE_TABLE_FLIGHT_APPLICATIONS = "tblU1G8DRtIBCg2Xd"
AIRTABLE_TABLE_CONTACT_INQUIRIES = "tblUs7duWvhQctspg"
BEEHIIV_PUB_ID = "pub_0be395f6-cacb-4ba9-b8a5-04c69ea44bf1"
# Not secret — a channel ID, not a credential. The private #reports channel created for this project.
SLACK_CHANNEL_ID = "C0BG6A1GGD7"

# Secrets (never in this file — set via `wrangler secret put NAME` from this directory):
#   AIRTABLE_API_KEY - same PAT used by cloudflare/subscribe-worker.js
#   BEEHIIV_API_KEY  - same key used by cloudflare/subscribe-worker.js
#   SLACK_BOT_TOKEN  - xoxb-... token from the Slack App's chat:write bot scope (see setup runbook).
#                      Real Block Kit tables require the Bot API — a Workflow Builder webhook
#                      can't carry table blocks, only plain-text variable substitution.
#   DEBUG_RUN_TOKEN  - random token gating the /debug/run route
