name = "skyfares-altitude"
main = "worker.js"
compatibility_date = "2024-01-01"
# Required by @cloudflare/puppeteer (guide PDF generation — see
# services/guidePdf.js), which imports Node's `Buffer` built-in internally.
# Without this flag, PDF generation throws at runtime the first time it runs —
# `wrangler deploy` doesn't catch it, only `--dry-run`'s bundler warning does.
compatibility_flags = ["nodejs_compat"]

[triggers]
# The frequent segment-recalculation cron (originally every minute, then
# every 5 min) was dropped entirely on 2026-08-04 -- every event that
# actually changes a segment already triggers its own real-time
# recalculation inline (see services/beehiiv.js), so a separate periodic
# sweep was pure redundant Beehiiv API traffic. "0 1 * * *" is the daily
# safety net (also covers the segments that no longer get real-time
# recalculation -- see worker.js's scheduled() and
# triggerSegmentRecalculation's own comments).
# "*/10 * * * *" is a separate, more frequent schedule added 2026-08-31 for
# Altitude content publish notifications (see worker.js's scheduled() and
# orchestration/cron.js's notifyPublishedAltitudeContent) -- deliberately
# not folded into the daily cron so newly-Published content reaches
# subscribed members within minutes, not once a day.
crons = ["0 1 * * *", "*/10 * * * *"]

[vars]
BEEHIIV_PUB_ID = "pub_0be395f6-cacb-4ba9-b8a5-04c69ea44bf1"
BEEHIIV_ALTITUDE_TIER_ID = "tier_0307bb2b-667d-4e56-afbd-31edc9114a8e"
BEEHIIV_ALTITUDE_TIER_NAME = "Altitude Access"
AIRTABLE_BASE_ID = "appA5rSlwgc57nswR"
AIRTABLE_TABLE_FLIGHT_APPLICATIONS = "tblU1G8DRtIBCg2Xd"
AIRTABLE_TABLE_CONTACT_INQUIRIES = "tblUs7duWvhQctspg"
AIRTABLE_TABLE_TESTIMONIALS = "tbl2LuRuQ0DE27HVZ"
AIRTABLE_TABLE_SKYFARE_ROUTES = "tbloSIbPa0C1mJ7Zu"
AIRTABLE_TABLE_CABIN_COMPARE_ROUTES = "tbltiIyB1qKpPdrS4"
AIRTABLE_TABLE_SEAT_PRODUCTS = "tblUZXCfKZHV14NQL"
AIRTABLE_TABLE_CABIN_COMPARE_OPTIONS = "tblBSnaZtPFe33cGa"
AIRTABLE_TABLE_GUIDE_CHAPTERS = "tblj7m9IMjMgESeah"
AIRTABLE_TABLE_ASSESSMENT_BOOKINGS = "tbl0Wvk8FIkKl9yfe"
AIRTABLE_TABLE_ALTITUDE_SUBSCRIBERS = "tblvGUFFeUG9gwvDS"
AIRTABLE_TABLE_ALTITUDE_AWARD_ALERTS = "tblHS1t4824GjGFcr"
AIRTABLE_TABLE_ALTITUDE_ROUTING_STRATEGIES = "tblWIpRjviDY3bNHF"
AIRTABLE_TABLE_ALTITUDE_KRISFLYER_ESCAPES = "tbl8oqWJPGKzwPBK5"
AIRTABLE_TABLE_ALTITUDE_CABIN_VERDICTS = "tblfjZiXjSsPeH6gL"

[[kv_namespaces]]
binding = "ALTITUDE_KV"
id = "a283ddfad0f44429b1d72e7759c68ad5"

# ── KrisFlyer Guide: secure PDF delivery ──────────────────────────────────────
# New for this feature (2026-07-30) — see cloudflare/services/guidePdf.js.
# Puppeteer render for the guide PDF.
[browser]
binding = "BROWSER"

# Temporary PDF storage for the "Send to My Email" flow only (never used by
# the direct-download flow, which streams fully in-memory). NOT delete-on-
# first-fetch (see orchestration/guidePdfHandlers.js's handleGuidePdfFetch for
# why — email security scanners pre-fetch links) — cleanup relies entirely on
# this bucket having an object-lifecycle expiration rule configured (24h).
# wrangler.toml has no lifecycle config section of its own — set it up via
# the R2 dashboard (bucket → Settings → Object Lifecycle Rules → Add rule) or
# `wrangler r2 bucket lifecycle add skyfares-guide-pdf-temp` (see
# https://developers.cloudflare.com/r2/buckets/object-lifecycles/ for exact flags).
# Provision with: wrangler r2 bucket create skyfares-guide-pdf-temp
[[r2_buckets]]
binding = "GUIDE_PDF_BUCKET"
bucket_name = "skyfares-guide-pdf-temp"

# Provision with: wrangler d1 create skyfares-guide-audit
# then fill in database_id below, and apply migrations/0001_guide_pdf_audit_log.sql
[[d1_databases]]
binding = "AUDIT_DB"
database_name = "skyfares-guide-audit"
database_id = "9ba791c3-5397-447e-9263-b635fcdbe9fd"

# ── Web Push: subscription storage ────────────────────────────────────────────
# New for this feature (2026-08-30) — see cloudflare/orchestration/pushHandlers.js.
# A separate database from AUDIT_DB above on purpose: push_subscriptions is
# actively queried/updated app state (every subscribe, unsubscribe, and send
# touches it), not a write-mostly audit trail — a different concern from
# guide_pdf_audit_log, so it gets its own binding rather than a second table
# bolted onto AUDIT_DB.
# Provision with: wrangler d1 create skyfares-push
# then fill in database_id below, and apply migrations/0002_push_subscriptions.sql
[[d1_databases]]
binding = "PUSH_DB"
database_name = "skyfares-push"
database_id = "5931bec1-f13a-4f3b-8e33-a4f0b84d94b3"

# Imports templates/*.html as a raw text module (see services/guidePdf.js's
# `import templateHtml from '../templates/pdf-kf-guide-template.html'`).
[[rules]]
type = "Text"
globs = ["templates/*.html"]
fallthrough = true
